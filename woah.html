<style>
    .tooltip {
    position: relative;
}

.tooltip-text {
    visibility: hidden;
    position: absolute;
    bottom: 50%;
    left: 50%;
    transform: translateX(-50%);

    background-color: black;
    color: white;
    padding: 5px 8px;
    border-radius: 5px;

    white-space: nowrap;
}

.tooltip:hover .tooltip-text {
    visibility: visible;
}
</style>
<button class="tooltip">
    Hover me
    <span class="tooltip-text">Here's some extra information!</span>
</button>
